name: Fetch & Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每 20 分钟设置一个候选唤醒点以抵御 GitHub 免费队列丢包；距上次成功不满 50 分钟时脚本自动秒级跳过
    - cron: '7,27,47 * * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      should_deploy: ${{ steps.fetch.outputs.should_deploy }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Restore SQLite database from previous run
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/perkradar-data
          key: perkradar-sqlite-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            perkradar-sqlite-

      - name: Fetch 7 live sources & export board.json
        id: fetch
        env:
          DATA_DIR: ${{ runner.temp }}/perkradar-data
          DISABLE_SCHEDULER: '1'
          JINA_API_KEY: ${{ secrets.JINA_API_KEY }}
        run: npm run pages:fetch

      - name: Save updated SQLite database to cache
        if: always() && steps.fetch.outputs.should_deploy != 'false'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/perkradar-data
          key: perkradar-sqlite-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Detect GitHub Pages basePath
        id: basepath
        if: steps.fetch.outputs.should_deploy == 'true'
        run: |
          owner_lower="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          repo_name="${GITHUB_REPOSITORY#*/}"
          repo_lower="$(echo "${repo_name}" | tr '[:upper:]' '[:lower:]')"
          if [ "${repo_lower}" = "${owner_lower}.github.io" ]; then
            echo "base_path=" >> "$GITHUB_OUTPUT"
          else
            echo "base_path=/${repo_name}" >> "$GITHUB_OUTPUT"
          fi

      - name: Build static Next.js board
        if: steps.fetch.outputs.should_deploy == 'true'
        env:
          NEXT_PUBLIC_BASE_PATH: ${{ steps.basepath.outputs.base_path }}
        run: npm run pages:build

      - name: Upload Pages artifact
        if: steps.fetch.outputs.should_deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    if: needs.build.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
